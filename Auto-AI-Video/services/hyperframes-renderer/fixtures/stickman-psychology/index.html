<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Hiragino Sans GB";
        src: local("Hiragino Sans GB");
      }
      @font-face {
        font-family: "Songti SC";
        src: local("Songti SC");
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f4f1e8;
        color: #171916;
      }
      body { font-family: "Songti SC", serif; }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f4f1e8;
      }
      #scene-1 { z-index: 1; }
      #scene-2 { z-index: 2; opacity: 0; }
      .paper-grid {
        position: absolute;
        inset: 0;
        opacity: 0.13;
        background-image:
          linear-gradient(#62665d 1px, rgba(98, 102, 93, 0) 1px),
          linear-gradient(90deg, #62665d 1px, rgba(98, 102, 93, 0) 1px);
        background-size: 72px 72px;
      }
      .scene-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 150px 100px;
        gap: 48px;
      }
      .eyebrow {
        align-self: flex-start;
        padding: 14px 22px;
        border: 3px solid #171916;
        border-radius: 999px;
        background: #b7e43a;
        font-family: "Hiragino Sans GB", sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      h1, h2 {
        max-width: 880px;
        margin: 0;
        font-family: "Hiragino Sans GB", sans-serif;
        font-weight: 900;
        line-height: 1.12;
        letter-spacing: -0.045em;
      }
      h1 { font-size: 102px; }
      h2 { font-size: 92px; }
      .subcopy {
        max-width: 820px;
        margin: 0;
        color: #62665d;
        font-size: 42px;
        font-weight: 300;
        line-height: 1.55;
      }
      .figure-stage {
        position: relative;
        width: 100%;
        height: 570px;
        border: 4px solid #171916;
        border-radius: 42px;
        background: rgba(244, 241, 232, 0.94);
        box-shadow: 22px 24px 0 #171916;
      }
      .figure-stage svg { width: 100%; height: 100%; }
      .thought {
        position: absolute;
        right: 70px;
        top: 68px;
        width: 270px;
        padding: 24px 28px;
        border: 3px solid #171916;
        border-radius: 50%;
        background: #e3a66f;
        font-family: "Hiragino Sans GB", sans-serif;
        font-size: 34px;
        font-weight: 800;
        line-height: 1.25;
        text-align: center;
      }
      .action-card {
        display: flex;
        align-items: center;
        gap: 30px;
        width: 100%;
        padding: 34px 40px;
        border: 4px solid #171916;
        border-radius: 30px;
        background: #b7e43a;
        box-shadow: 16px 18px 0 #171916;
      }
      .action-number {
        flex: 0 0 auto;
        font-family: "Hiragino Sans GB", sans-serif;
        font-size: 88px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .action-copy {
        font-family: "Hiragino Sans GB", sans-serif;
        font-size: 43px;
        font-weight: 800;
        line-height: 1.35;
      }
      .footer-note {
        color: #62665d;
        font-size: 30px;
        line-height: 1.5;
      }
      .scribble {
        position: absolute;
        border: 5px solid #e3a66f;
        border-radius: 50%;
        opacity: 0.75;
      }
      .scribble-a { width: 320px; height: 210px; right: -110px; top: 190px; transform: rotate(-18deg); }
      .scribble-b { width: 270px; height: 160px; left: -120px; bottom: 220px; transform: rotate(12deg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <section id="scene-1" class="scene">
        <div class="paper-grid" data-layout-ignore></div>
        <div class="scribble scribble-a" data-layout-allow-overflow></div>
        <div class="scene-content">
          <div class="eyebrow">火柴人心理学 · 01</div>
          <h1>越想停止内耗，脑子为什么越吵？</h1>
          <div class="figure-stage">
            <svg viewBox="0 0 820 570" aria-label="抱头思考的火柴人">
              <g id="figure-one" fill="none" stroke="#171916" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="330" cy="175" r="72"></circle>
                <path d="M330 250 L330 390 M330 292 L235 230 M330 292 L420 230 M330 390 L250 500 M330 390 L430 490"></path>
                <path d="M235 230 L280 145 M420 230 L382 145"></path>
              </g>
            </svg>
            <div class="thought">别再想了<br />快停下来</div>
          </div>
          <p class="subcopy">压住一个念头时，大脑会先不断检查它有没有回来。</p>
        </div>
      </section>

      <section id="scene-2" class="scene">
        <div class="paper-grid" data-layout-ignore></div>
        <div class="scribble scribble-b" data-layout-allow-overflow></div>
        <div class="scene-content">
          <div class="eyebrow">把对抗换成观察</div>
          <h2>先给它一个名字，再决定下一步。</h2>
          <div class="action-card">
            <span class="action-number">10</span>
            <span class="action-copy">用十秒说出：<br />“我正在担心失败。”</span>
          </div>
          <p class="subcopy">命名情绪不是认输，而是把你和念头重新分开。</p>
          <p class="footer-note">这不是医学诊断；持续困扰时，请寻求专业支持。</p>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#scene-1 .eyebrow", { y: 36, opacity: 0, duration: 0.48, ease: "back.out(1.5)" }, 0.2);
      tl.from("#scene-1 h1", { y: 64, opacity: 0, duration: 0.72, ease: "power3.out" }, 0.38);
      tl.from("#scene-1 .figure-stage", { scale: 0.93, rotation: -1.5, opacity: 0, duration: 0.66, ease: "expo.out" }, 0.72);
      tl.from("#figure-one", { y: 30, opacity: 0, duration: 0.52, ease: "sine.out" }, 1.0);
      tl.from("#scene-1 .thought", { scale: 0.7, opacity: 0, duration: 0.45, ease: "back.out(1.8)" }, 1.18);
      tl.from("#scene-1 .subcopy", { x: -40, opacity: 0, duration: 0.52, ease: "power2.out" }, 1.42);

      tl.to("#scene-1", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 3.7);
      tl.fromTo("#scene-2", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.7);

      tl.from("#scene-2 .eyebrow", { x: -44, opacity: 0, duration: 0.46, ease: "power3.out" }, 4.05);
      tl.from("#scene-2 h2", { y: 58, opacity: 0, duration: 0.68, ease: "expo.out" }, 4.2);
      tl.from("#scene-2 .action-card", { scale: 0.92, rotation: 1.2, opacity: 0, duration: 0.62, ease: "back.out(1.4)" }, 4.55);
      tl.from("#scene-2 .subcopy", { x: 42, opacity: 0, duration: 0.5, ease: "sine.out" }, 4.92);
      tl.from("#scene-2 .footer-note", { y: 30, opacity: 0, duration: 0.44, ease: "power2.out" }, 5.18);
      tl.to("#scene-2", { opacity: 0, duration: 0.55, ease: "power1.in" }, 7.35);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
