name: HyperFrames Linux 一致性验证

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/hyperframes-renderer/**"
      - ".github/workflows/hyperframes-linux.yml"
  push:
    branches:
      - main
    paths:
      - "services/hyperframes-renderer/**"
      - ".github/workflows/hyperframes-linux.yml"

permissions:
  contents: read

jobs:
  headless-shell-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      HYPERFRAMES_RUN_ID: pixelle-linux-headless-20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/hyperframes-renderer/package-lock.json
            services/hyperframes-renderer/fixtures/stickman-psychology/package-lock.json

      - name: 安装 FFmpeg 与中文字体
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 安装固定依赖
        working-directory: services/hyperframes-renderer
        run: |
          npm ci
          npm ci --prefix fixtures/stickman-psychology

      - name: 准备 HyperFrames headless-shell
        working-directory: services/hyperframes-renderer
        run: |
          npx hyperframes browser ensure
          echo "HYPERFRAMES_BROWSER_PATH=$(npx hyperframes browser path)" >> "$GITHUB_ENV"

      - name: 连续渲染 20 次
        working-directory: services/hyperframes-renderer
        run: npm run stability

      - name: 校验 Linux 报告与进程残留
        working-directory: services/hyperframes-renderer
        run: npm run verify:linux

      - name: 保存验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-linux-headless-report
          path: |
            services/hyperframes-renderer/benchmark-results/*.json
            services/hyperframes-renderer/benchmark-results/*.mp4
          retention-days: 7
