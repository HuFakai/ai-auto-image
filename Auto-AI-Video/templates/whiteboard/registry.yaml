schema_version: 1
templates:
  - id: minimal-whiteboard
    version: 1
    name: 极简粗线简笔白板风
    description: 粗黑线、少量配色、清爽留白
    recommended_for: [知识讲解, 个人表达, 复盘总结]
    preview: assets/whiteboard/previews/minimal-whiteboard.webp
    prompt_recipe: >-
      暖白色纯净背景，圆润有亲和力的粗黑马克笔轮廓，人物和物体高度概括，
      只使用橙色与钴蓝色做少量平涂点缀；几乎没有阴影、纹理和细碎结构，留白充足，
      像现场快速画出的清爽白板简笔画。
    render_profile: {background_mode: light, path_mode: skeleton, reveal_mode: ink_then_color, color_fill: contour_wipe, stroke_detail: standard}
  - id: business-doodle
    version: 1
    name: 极简商务涂鸦风
    description: 几何图表、蓝绿配色、专业克制
    recommended_for: [产品介绍, 商业分析, 项目汇报]
    preview: assets/whiteboard/previews/business-doodle.webp
    prompt_recipe: >-
      冷白至极浅灰背景，深海军蓝的精准几何轮廓，钴蓝与青绿色作为强调色；
      用整齐的卡片、流程箭头、图表和图标组织信息，线条克制利落、间距规整，
      呈现专业的商业演示和科技产品解说感，禁止暖黄纸张与随意手绘笔触。
    render_profile: {background_mode: light, path_mode: skeleton, reveal_mode: ink_then_color, color_fill: contour_wipe, stroke_detail: detailed}
  - id: warm-pencil
    version: 1
    name: 暖米黄素描白板风
    description: 铅笔排线、纸张质感、温暖细腻
    recommended_for: [人物故事, 个人成长, 品牌叙事]
    preview: assets/whiteboard/previews/warm-pencil.webp
    prompt_recipe: >-
      温暖米黄色纸张底色，真实石墨铅笔线条，轻柔排线、交叉线和深浅笔压，
      辅以低饱和赭石色与灰蓝色；保留手工速写的纸张颗粒和结构细节，
      像一本质感细腻的编辑手账，不能画成粗线扁平图标。
    render_profile: {background_mode: light, path_mode: skeleton, reveal_mode: ink_then_color, color_fill: brush, stroke_detail: detailed}
  - id: guofeng-flat
    version: 1
    name: 粗线扁平国风卡通
    description: 朱红玉绿、国风纹样、生动平涂
    recommended_for: [传统文化, 国风品牌, 中文创意]
    preview: assets/whiteboard/previews/guofeng-flat.webp
    prompt_recipe: >-
      温暖宣纸色背景，深棕色粗轮廓，朱红、玉绿与靛青的饱和平涂色块；
      人物比例生动简化，少量使用祥云、笔触和中式构图节奏，
      形成现代国风科普动画效果，禁止写实素描和欧美商务信息图观感。
    render_profile: {background_mode: light, path_mode: skeleton, reveal_mode: ink_then_color, color_fill: contour_wipe, stroke_detail: standard}
  - id: viral-pop
    version: 1
    name: 爆款高热吸睛风
    description: 高饱和、强对比、短视频冲击力
    recommended_for: [短视频开场, 强观点, 热点表达]
    preview: assets/whiteboard/previews/viral-pop.webp
    prompt_recipe: >-
      明亮黄色高能背景，超粗黑色外轮廓，热烈橙红与电光钴蓝的大色块，
      夸张但友好的人物表情和动作，配合放射爆炸形、速度线与强烈斜向构图；
      主体要大、对比要强、第一眼就能看懂，但保持轮廓干净，不能堆满琐碎元素。
    render_profile: {background_mode: light, path_mode: skeleton, reveal_mode: ink_then_color, color_fill: contour_wipe, stroke_detail: light}
  - id: black-gold-tech
    version: 1
    name: 黑金科技发布会风
    description: 黑金光效、科技舞台、高级权威
    recommended_for: [AI, 科技产品, 发布会]
    preview: assets/whiteboard/previews/black-gold-tech.webp
    prompt_recipe: >-
      深黑与炭灰背景，金属金色作为主轮廓和高光，少量电光青色点缀；
      使用精致的环形界面、几何数据结构和舞台式光影，主体高级、权威、科技感强，
      像高端科技产品发布会，禁止暖白纸张和可爱手绘效果。
    render_profile: {background_mode: dark, path_mode: edge, reveal_mode: edge_then_color, color_fill: contour_wipe, stroke_detail: detailed}
  - id: healing-journal
    version: 1
    name: 清新治愈手账风
    description: 柔和水彩、治愈配色、生活手账
    recommended_for: [情感, 生活方式, 自我成长]
    preview: assets/whiteboard/previews/healing-journal.webp
    prompt_recipe: >-
      奶油白纸张背景，圆润轻柔的手绘线条，鼠尾草绿、蜜桃粉、奶油黄和天蓝色的低饱和水彩；
      少量加入胶带、贴纸与植物点缀，整体通透、温暖、治愈、生活化，
      保持留白，禁止强烈黑线和高对比商务图表。
    render_profile: {background_mode: light, path_mode: region, reveal_mode: region_then_color, color_fill: brush, stroke_detail: standard}
  - id: retro-collage
    version: 1
    name: 复古报纸拼贴风
    description: 撕纸拼贴、半色调、编辑视觉
    recommended_for: [深度观点, 文化内容, 案例复盘]
    preview: assets/whiteboard/previews/retro-collage.webp
    prompt_recipe: >-
      暖灰新闻纸底色，黑色油墨主体、复古红色强调块、半色调网点、丝网印刷颗粒与撕纸边缘；
      人物和物体像剪下后重新拼贴的编辑视觉，层次大胆、粗粝、有文化杂志感，
      禁止光滑渐变和现代扁平信息图。
    render_profile: {background_mode: light, path_mode: region, reveal_mode: region_then_color, color_fill: contour_wipe, stroke_detail: standard}
  - id: paper-metaphor
    version: 1
    name: 纸感隐喻拼贴风
    description: 手工剪纸、观点隐喻、高级克制
    recommended_for: [价值观, 关系, 流程, 复杂观点]
    preview: assets/whiteboard/previews/paper-metaphor.png
    prompt_recipe: >-
      暖米白手工纸背景，清晰纸纤维、撕边、轻微褶皱与手工裁切痕迹；人物和物体由剪纸拼贴叠层构成，
      带柔和浅浮雕投影。主色仅使用米杏、炭黑、深灰、暖灰、珊瑚红和灰粉，金黄只用于关键转折。
      每张图只选择定义、流程、对比、层级、因果、清单、时间或矩阵中的一个主结构，留白占 25%–45%。
    render_profile: {background_mode: light, path_mode: region, reveal_mode: region_then_color, color_fill: contour_wipe, stroke_detail: light}
  - id: comic-ink-explainer
    version: 1
    name: 漫画墨线解释风
    description: 漫画墨线、半调网点、概念机制
    recommended_for: [原理讲解, 机制拆解, 商业洞察]
    preview: assets/whiteboard/previews/oil-visual.png
    prompt_recipe: >-
      暖灰米白纸张背景，使用自信、粗细有变化的黑色漫画墨线；灰面和阴影只用经典圆点半色调。
      黑白灰为主体，固定暖黄色只用于关键物件，每张图最多再使用两种低饱和语义色。
      关系必须用具体物件、路径、状态变化和重复材料证明，禁止 3D、摄影写实和光滑渐变。
    render_profile: {background_mode: light, path_mode: skeleton, reveal_mode: ink_then_color, color_fill: contour_wipe, stroke_detail: full}
  - id: clay-3d
    version: 1
    name: 3D黏土趣味风
    description: 黏土材质、玩具比例、温暖可爱
    recommended_for: [亲子教育, 轻量品牌, 趣味科普]
    preview: assets/whiteboard/previews/clay-3d.webp
    prompt_recipe: >-
      可爱的三维黏土动画场景，圆润玩具化比例，可见细微手作指纹，
      珊瑚橙、青绿色、亮黄色和奶油色的柔和配色，温暖棚拍光与轻柔投影，
      像精致的定格动画小剧场，主体清楚，禁止二维线稿和写实摄影材质。
    render_profile: {background_mode: auto, path_mode: region, reveal_mode: region_then_color, color_fill: contour_wipe, stroke_detail: light}
  - id: cyber-neon
    version: 1
    name: 赛博霓虹漫画风
    description: 霓虹青紫、漫画速度线、未来感
    recommended_for: [AI趋势, 数码科技, 年轻化观点]
    preview: assets/whiteboard/previews/cyber-neon.webp
    prompt_recipe: >-
      深靛蓝至黑色背景，青色与洋红色霓虹边缘光，紫色渐变和粗黑漫画轮廓；
      加入克制的速度线、全息几何形与未来创作者工作室氛围，构图动感、戏剧性强，
      同时确保人物面部和关键物体清楚可读。
    render_profile: {background_mode: dark, path_mode: edge, reveal_mode: edge_then_color, color_fill: contour_wipe, stroke_detail: standard}
