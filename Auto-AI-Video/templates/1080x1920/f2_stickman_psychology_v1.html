<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="template:media-width" content="1024">
  <meta name="template:media-height" content="1536">
  <meta name="viewport" content="width=1080, height=1920">
  <title>火柴人心理学 V1</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { position: relative; background: {{surface_color:color=#F7F2E8}}; color: {{text_color:color=#171916}}; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
    .media { position: absolute; inset: 150px 54px 430px; overflow: hidden; border: 4px solid {{text_color:color=#171916}}; background: #fff; }
    .media img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 68%, rgba(243,201,75,.22)); }
    .brand { position: absolute; left: 81px; top: 56px; padding: 14px 22px; border: 3px solid {{text_color:color=#171916}}; background: {{accent_color:color=#F3C94B}}; font-size: 25px; font-weight: 900; letter-spacing: .08em; }
    .title { position: absolute; top: 96px; right: 81px; width: 470px; text-align: right; font-size: 30px; font-weight: 850; line-height: 1.25; }
    .card { position: absolute; left: 81px; right: 81px; bottom: 350px; padding: 38px 42px 42px; border: 4px solid {{text_color:color=#171916}}; background: rgba(247,242,232,{{card_opacity:number=0.94}}); box-shadow: 14px 14px 0 {{accent_color:color=#F3C94B}}; }
    .eyebrow { margin-bottom: 17px; font-size: 22px; font-weight: 900; letter-spacing: .14em; }
    .copy { margin: 0; font-size: 50px; font-weight: 850; line-height: 1.34; overflow-wrap: anywhere; }
    .progress { position: absolute; left: 81px; right: 81px; bottom: 292px; height: 5px; background: rgba(23,25,22,.16); }
    .progress span { display: block; width: {{progress_percent:number=16.66}}%; height: 100%; background: {{text_color:color=#171916}}; }
  </style>
</head>
<body>
  <div class="media" data-pixelle-media-layer="inset"><img src="{{image}}" alt=""></div>
  <div class="brand">{{brand_label:text=火柴人心理学}}</div>
  <div class="title" data-pixelle-safe="title" data-pixelle-safe-min-font="24">{{title}}</div>
  <section class="card">
    <div class="eyebrow">{{eyebrow_label:text=MENTAL NOTE}} · {{index}}</div>
    <p class="copy" data-pixelle-safe="subtitle" data-pixelle-safe-min-font="30">{{text}}</p>
  </section>
  <div class="progress"><span></span></div>
</body>
</html>
