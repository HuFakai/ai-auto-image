<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="template:media-width" content="1024">
  <meta name="template:media-height" content="1536">
  <meta name="viewport" content="width=1080, height=1920">
  <title>知识卡片 V1</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { position: relative; background: {{surface_color:color=#0B0F0D}}; color: {{text_color:color=#F4F5EF}}; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
    body::after { content: ""; position: absolute; inset: 0; opacity: .16; background-image: linear-gradient(rgba(255,255,255,.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.15) 1px, transparent 1px); background-size: 54px 54px; pointer-events: none; }
    .media { position: absolute; inset: 185px 42px 515px; overflow: hidden; border: 1px solid rgba(255,255,255,.24); }
    .media img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 52%, {{surface_color:color=#0B0F0D}} 100%); }
    .brand { position: absolute; z-index: 2; left: 81px; top: 52px; color: {{accent_color:color=#BFFF3C}}; font-size: 24px; font-weight: 850; letter-spacing: .15em; }
    .title { position: absolute; z-index: 2; left: 81px; right: 81px; top: 98px; padding-bottom: 25px; border-bottom: 2px solid {{accent_color:color=#BFFF3C}}; font-size: 45px; font-weight: 850; line-height: 1.24; }
    .card { position: absolute; z-index: 2; left: 81px; right: 81px; bottom: 360px; padding: 34px 38px 40px; border: 1px solid rgba(255,255,255,.25); border-left: 8px solid {{accent_color:color=#BFFF3C}}; background: rgba(11,15,13,{{card_opacity:number=0.88}}); backdrop-filter: blur(14px); }
    .eyebrow { margin-bottom: 17px; color: {{accent_color:color=#BFFF3C}}; font-size: 21px; font-weight: 850; letter-spacing: .16em; }
    .copy { margin: 0; font-size: 47px; font-weight: 760; line-height: 1.42; overflow-wrap: anywhere; }
    .progress { position: absolute; z-index: 2; left: 81px; right: 81px; bottom: 302px; height: 4px; background: rgba(255,255,255,.16); }
    .progress span { display: block; width: {{progress_percent:number=16.66}}%; height: 100%; background: {{accent_color:color=#BFFF3C}}; }
  </style>
</head>
<body>
  <div class="media" data-pixelle-media-layer="inset"><img src="{{image}}" alt=""></div>
  <div class="brand">{{brand_label:text=一分钟知识卡}}</div>
  <div class="title" data-pixelle-safe="title" data-pixelle-safe-min-font="28">{{title}}</div>
  <section class="card">
    <div class="eyebrow">{{eyebrow_label:text=KNOWLEDGE / NOTE}} · {{index}}</div>
    <p class="copy" data-pixelle-safe="subtitle" data-pixelle-safe-min-font="30">{{text}}</p>
  </section>
  <div class="progress"><span></span></div>
</body>
</html>
