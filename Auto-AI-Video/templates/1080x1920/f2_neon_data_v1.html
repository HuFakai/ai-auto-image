<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="template:media-width" content="1024">
  <meta name="template:media-height" content="1536">
  <meta name="viewport" content="width=1080, height=1920">
  <title>霓虹数据舱 V1</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { position: relative; background: {{surface_color:color=#07121A}}; color: {{text_color:color=#E9FFFA}}; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
    body::after { content: ""; position: absolute; inset: 0; opacity: .32; background-image: linear-gradient(rgba(101,246,211,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(101,246,211,.14) 1px, transparent 1px); background-size: 72px 72px; pointer-events: none; }
    .media { position: absolute; inset: 218px 42px 536px; overflow: hidden; border: 1px solid {{accent_color:color=#65F6D3}}; clip-path: polygon(0 0, 94% 0, 100% 7%, 100% 100%, 6% 100%, 0 93%); }
    .media img { width: 100%; height: 100%; display: block; object-fit: cover; filter: saturate(.88) contrast(1.12); }
    .media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,18,26,.08), transparent 52%, {{surface_color:color=#07121A}}); }
    .brand { position: absolute; left: 81px; top: 60px; padding: 12px 18px; border: 1px solid {{accent_color:color=#65F6D3}}; color: {{accent_color:color=#65F6D3}}; font-size: 21px; font-weight: 850; letter-spacing: .18em; }
    .title { position: absolute; left: 81px; right: 81px; top: 130px; font-size: 51px; font-weight: 850; line-height: 1.22; text-shadow: 0 0 25px rgba(101,246,211,.3); }
    .card { position: absolute; left: 81px; right: 81px; bottom: 370px; padding: 34px 38px 40px; border: 1px solid {{accent_color:color=#65F6D3}}; border-left: 9px solid {{accent_color:color=#65F6D3}}; background: rgba(7,18,26,{{card_opacity:number=0.86}}); box-shadow: 0 0 40px rgba(101,246,211,.12); backdrop-filter: blur(17px); }
    .eyebrow { margin-bottom: 17px; color: {{accent_color:color=#65F6D3}}; font-size: 20px; font-weight: 850; letter-spacing: .19em; }
    .copy { margin: 0; font-size: 47px; font-weight: 720; line-height: 1.4; overflow-wrap: anywhere; }
    .progress { position: absolute; left: 81px; right: 81px; bottom: 286px; height: 4px; background: rgba(101,246,211,.18); }
    .progress span { display: block; width: {{progress_percent:number=20}}%; height: 100%; background: {{accent_color:color=#65F6D3}}; box-shadow: 0 0 16px {{accent_color:color=#65F6D3}}; }
  </style>
</head>
<body>
  <div class="media" data-pixelle-media-layer="inset"><img src="{{image}}" alt=""></div>
  <div class="brand">{{brand_label:text=SIGNAL LAB}}</div>
  <div class="title" data-pixelle-safe="title" data-pixelle-safe-min-font="29">{{title}}</div>
  <section class="card">
    <div class="eyebrow">{{eyebrow_label:text=DATA / EXPLAINED}} · {{index}}</div>
    <p class="copy" data-pixelle-safe="subtitle" data-pixelle-safe-min-font="30">{{text}}</p>
  </section>
  <div class="progress"><span></span></div>
</body>
</html>
