  prompt_prefix: '生活小技巧漫画风格，竖版短视频画面。暖灰米白纸张背景，自信的黑色漫画墨线，线条粗细有变化；灰面和阴影使用经典圆点半色调。人物以夸张可爱的漫画造型出现，表情和肢体动作传递轻松幽默感；画面中保留手绘对话气泡和旁白说明位置，对话气泡线条干净。黑白灰为主体，固定暖黄色只用于关键道具，最多再使用两种低饱和语义色。禁止3D、摄影写实和光滑渐变，整体像一本随手翻开的四格生活漫画。

    '
