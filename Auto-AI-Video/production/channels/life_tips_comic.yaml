  style_prompt: 中国古风水墨山水画风格，竖版短视频画面。淡墨与浓墨层次，宣纸质感与柔和晕染，留白构图，远山近水、孤舟渔火、月下松竹、亭台烟雨等诗意意象。线条写意、色彩克制（墨色为主，可点缀淡青、赭石、月白），禁止现代都市、科幻、真人实拍、卡通3D、霓虹赛博。镜头缓慢推移如卷轴展开，意境空灵、古朴、诗意。
