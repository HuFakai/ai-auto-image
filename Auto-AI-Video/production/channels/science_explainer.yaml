id: science_explainer
name: 一分钟科普
enabled: true
topic:
  strategy: llm
  seeds:
  - 为什么刚下过雨时，空气里会有一种特别的气味？
  - 微波炉为什么能加热食物，却很少把盘子直接加热？
  - 人在睡着后，大脑真的也休息了吗？
  - 为什么猫从高处落下时更容易调整成四脚着地？
  - 宇航员在空间站里为什么每天能看到很多次日出？
  prompt: 为“一分钟科普”竖屏短视频策划一个单一、准确、有反直觉亮点的日常科学选题。 主题可来自人体、睡眠、动物、天文、材料、天气或生活物理；避免伪科学，
    明确区分事实与推测，并用普通人能理解的类比解释。
