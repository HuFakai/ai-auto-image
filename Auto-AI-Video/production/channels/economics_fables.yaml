  - 小岛上的渔民为什么越捕越少？
  - 两个村庄共用一片草场，为什么草场会退化？
  - 人人都想走捷径，为什么捷径反而变成最远的路？
  - 一个农夫的鸡蛋该留给自己吃还是拿去卖？
  prompt: 为“经济学寓言”频道策划一期短视频：以经济学研究生的视角写一个原创寓言故事，用间接、隐喻的方式讲清一个经济学、心理学或社会学概念。不要在开头点破概念，尽量让观众在故事接近尾声时才恍然意识到；故事讲完后，再用30秒左右解释这个概念，并逐条说明故事中的角色、场景、冲突分别隐喻什么。每期控制在90秒以内，避免复杂数学，不制造焦虑，适合零基础观众。
