<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A · 暗室暗房 — AI 图文工坊</title>
<style>
  /* ── Token:暖炭暗房 / 纸白文字 / 暗房红灯 ── */
  :root{
    --bg:#141210; --panel:#1C1916; --card:#211D19; --line:#35302A;
    --ink:#EDE7DA; --ink-soft:#9A9184; --ink-faint:#6B6459;
    --red:#E05038; --red-dim:#8A3526;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:dark}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--red-dim);color:#fff}

  /* ── 骨架:左图标导航 + 主区 ── */
  .shell{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
  nav.side{
    border-right:1px solid var(--line); background:var(--panel);
    display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;
    position:sticky;top:0;height:100vh;
  }
  .logo{
    width:36px;height:36px;border:1px solid var(--red);color:var(--red);
    display:grid;place-items:center;font-family:var(--mono);font-weight:700;
    margin-bottom:18px;border-radius:8px;
  }
  .nav-item{
    width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
    color:var(--ink-faint);cursor:pointer;transition:.18s;position:relative;
  }
  .nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
  .nav-item:hover{color:var(--ink);background:#241F1B}
  .nav-item.active{color:var(--red);background:#2A201C}
  .nav-item .tip{
    position:absolute;left:54px;background:#2A2521;border:1px solid var(--line);
    padding:4px 10px;border-radius:6px;font-size:12px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:.15s;color:var(--ink)
  }
  .nav-item:hover .tip{opacity:1}
  .nav-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center}

  /* ── 顶栏 ── */
  .topbar{
    height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    padding:0 20px;gap:14px;position:sticky;top:0;background:rgba(20,18,16,.86);
    backdrop-filter:blur(8px);z-index:10;
  }
  .crumb{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-soft)}
  .crumb b{color:var(--ink);font-weight:600}
  .pill{
    font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:99px;
    border:1px solid var(--line);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:#5FA36B}
  .topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .avatar{
    width:28px;height:28px;border-radius:50%;background:#3A342E;color:var(--ink);
    display:grid;place-items:center;font-size:12px;border:1px solid var(--line)
  }

  main{padding:22px 26px 190px}

  /* ── 统计行 ── */
  .stats{display:flex;gap:26px;margin-bottom:20px;flex-wrap:wrap}
  .stat .num{font-family:var(--mono);font-size:22px;font-weight:700}
  .stat .lbl{font-size:12px;color:var(--ink-faint)}

  /* ── 筛选 chips ── */
  .chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .chip{
    font-family:var(--mono);font-size:12px;padding:5px 14px;border-radius:99px;
    border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;transition:.15s;background:none
  }
  .chip:hover{color:var(--ink);border-color:var(--ink-faint)}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}

  /* ── 作品网格:显影效果 ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    cursor:pointer;transition:.2s;opacity:0;transform:translateY(10px);
    animation:rise .5s ease forwards;
  }
  .card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.07s}
  .card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.17s}
  .card:nth-child(5){animation-delay:.22s}.card:nth-child(6){animation-delay:.27s}
  .card:nth-child(7){animation-delay:.32s}.card:nth-child(8){animation-delay:.37s}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}}
  .card:hover{border-color:var(--red-dim);transform:translateY(-2px)}
  .cover{aspect-ratio:3/4;position:relative;overflow:hidden}
  .cover .img{
    position:absolute;inset:0;filter:brightness(.42) saturate(.9);
    transition:filter .45s ease, transform .45s ease;  /* 暗房显影:hover 显影 */
  }
  .card:hover .cover .img{filter:brightness(1) saturate(1.05);transform:scale(1.03)}
  .cover .cap{
    position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;
    background:linear-gradient(180deg,transparent 55%,rgba(10,9,8,.72));
    opacity:1;transition:.3s
  }
  .cover .cap .t{
    color:#fff;font-weight:700;font-size:15px;line-height:1.4;
    text-shadow:0 1px 8px rgba(0,0,0,.5)
  }
  .stamp{
    position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10px;
    padding:3px 8px;border-radius:5px;letter-spacing:.1em;
    background:rgba(10,9,8,.66);border:1px solid rgba(255,255,255,.16);color:#E8E2D6;
    backdrop-filter:blur(4px)
  }
  .stamp.warn{color:#F0B429;border-color:rgba(240,180,41,.4)}
  .meta{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 12px;font-family:var(--mono);font-size:11px;color:var(--ink-faint)
  }
  /* 占位封面:渐变模拟真实作品 */
  .ph-1{background:radial-gradient(120% 90% at 20% 15%,#2E4A8F 0%,#101A33 58%,#0A0F1E 100%)}
  .ph-2{background:linear-gradient(160deg,#F2E8D5 0%,#D8C9A8 45%,#8A6F45 100%)}
  .ph-3{background:radial-gradient(110% 100% at 75% 20%,#E8834A 0%,#B4402A 55%,#3E120C 100%)}
  .ph-4{background:linear-gradient(200deg,#20302B 0%,#0E1613 60%,#080B0A 100%)}
  .ph-5{background:radial-gradient(130% 100% at 50% 0%,#4A3F6B 0%,#241E38 55%,#0E0B18 100%)}
  .ph-6{background:linear-gradient(140deg,#DDE4EA 0%,#9FB2C4 50%,#4E6072 100%)}
  .ph-7{background:linear-gradient(180deg,#1E3A34 0%,#0C1714 100%)}
  .ph-8{background:radial-gradient(120% 100% at 30% 80%,#C8B7D9 0%,#7E6A99 45%,#2E2440 100%)}
  .bigchar{position:absolute;top:16%;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:44px;letter-spacing:.02em}
  .bigchar small{display:block;font-size:13px;font-weight:400;opacity:.75;margin-top:6px;letter-spacing:.3em}

  /* ── 底部创作条 ── */
  .createbar{
    position:fixed;bottom:20px;left:calc(64px + (100% - 64px)/2);transform:translateX(-50%);
    width:min(720px,calc(100vw - 110px));z-index:20;
  }
  .bar{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden;
  }
  .bar .row1{display:flex;gap:10px;padding:12px 12px 0 14px;align-items:center}
  .bar input{
    flex:1;background:none;border:none;outline:none;color:var(--ink);
    font-size:15px;padding:10px 2px;font-family:inherit
  }
  .bar input::placeholder{color:var(--ink-faint)}
  .btn-go{
    background:var(--red);color:#fff;border:none;border-radius:9px;padding:10px 20px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap
  }
  .btn-go:hover{background:#EE5F46}
  .bar .row2{
    display:flex;gap:6px;padding:8px 12px 12px;flex-wrap:wrap;align-items:center
  }
  .param{
    font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;
    display:inline-flex;gap:5px;align-items:center;background:none;transition:.15s
  }
  .param b{color:var(--ink);font-weight:600}
  .param:hover{border-color:var(--ink-faint);color:var(--ink)}
  .param.toggle::before{content:"";width:14px;height:8px;border-radius:99px;background:#3A342E;position:relative;display:inline-block;transition:.15s}
  .param.toggle::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-soft);position:absolute;margin-left:-16px;transition:.15s}
  .param.toggle{position:relative;padding-left:8px}
  .param.toggle.on{color:var(--ink)}
  .param.toggle.on::before{background:var(--red-dim)}
  .bar .expand{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint);background:none;border:none;cursor:pointer}
  .bar .expand:hover{color:var(--ink)}

  @media (max-width:860px){
    .shell{grid-template-columns:56px 1fr}
    .createbar{left:calc(56px + (100% - 56px)/2);width:calc(100vw - 84px)}
    .stats{gap:16px}
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="logo">印</div>
    <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg><span class="tip">工作台</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg><span class="tip">作品库</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/></svg><span class="tip">品牌手册</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg><span class="tip">渠道设置</span></div>
    <div class="nav-bottom">
      <div class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5 8-5s6.5 1 8 5"/></svg><span class="tip">admin</span></div>
    </div>
  </nav>

  <div>
    <header class="topbar">
      <span class="crumb">工作台 / <b>全部作品</b></span>
      <span class="pill"><span class="dot"></span>渠道在线 · deepseek-v4 + grok-imagine</span>
      <div class="right">
        <span class="pill">并发 4 路</span>
        <span class="avatar">A</span>
      </div>
    </header>

    <main>
      <div class="stats">
        <div class="stat"><div class="num">128</div><div class="lbl">作品总数</div></div>
        <div class="stat"><div class="num" style="color:var(--red)">3</div><div class="lbl">待评审</div></div>
        <div class="stat"><div class="num">1,024</div><div class="lbl">已生成图片</div></div>
        <div class="stat"><div class="num">¥86.40</div><div class="lbl">累计费用</div></div>
      </div>

      <div class="chips">
        <button class="chip on">全部</button>
        <button class="chip">待评审</button>
        <button class="chip">已完成</button>
        <button class="chip">失败</button>
        <button class="chip">知识卡片</button>
        <button class="chip">科普漫画</button>
        <button class="chip">金句卡</button>
      </div>

      <div class="grid">
        <div class="card"><div class="cover"><div class="img ph-1"></div><div class="bigchar">≈4<small>倍散射强度</small></div><span class="stamp">已生成</span></div>
          <div class="cap"></div>
          <div class="meta"><span>知识卡片 · 6P</span><span>3 分钟前</span></div></div>
        <div class="card"><div class="cover"><div class="img ph-2"></div><span class="stamp warn">待评审</span></div>
          <div class="meta"><span>图书推荐 · 5P</span><span>1 小时前</span></div></div>
        <div class="card"><div class="cover"><div class="img ph-3"></div><span class="stamp">已生成</span></div>
          <div class="meta"><span>产品种草 · 6P</span><span>2 小时前</span></div></div>
        <div class="card"><div class="cover"><div class="img ph-4"></div><span class="stamp">已生成</span></div>
          <div class="meta"><span>科普漫画 · 8P</span><span>昨天</span></div></div>
        <div class="card"><div class="cover"><div class="img ph-5"></div><span class="stamp">已生成</span></div>
          <div class="meta"><span>金句卡 · 5P</span><span>昨天</span></div></div>
        <div class="card"><div class="cover"><div class="img ph-6"></div><span class="stamp">已生成</span></div>
          <div class="meta"><span>长文拆解 · 7P</span><span>2 天前</span></div></div>
        <div class="card"><div class="cover"><div class="img ph-7"></div><span class="stamp">已生成</span></div>
          <div class="meta"><span>清单卡 · 4P</span><span>2 天前</span></div></div>
        <div class="card"><div class="cover"><div class="img ph-8"></div><span class="stamp">已生成</span></div>
          <div class="meta"><span>对比卡 · 5P</span><span>3 天前</span></div></div>
      </div>
    </main>
  </div>

  <div class="createbar">
    <div class="bar">
      <div class="row1">
        <input placeholder="输入主题,例如:三分钟看懂量子纠缠 — 回车或点「开始创作」">
        <button class="btn-go">开始创作</button>
      </div>
      <div class="row2">
        <button class="param">类型 <b>知识卡片</b></button>
        <button class="param">文字 <b>原生中文</b></button>
        <button class="param">比例 <b>3:4</b></button>
        <button class="param">品牌 <b>暗房工作室</b></button>
        <button class="param toggle on">封面候选</button>
        <button class="param toggle">审批门</button>
        <button class="expand">粘贴长文 · 从 URL 导入 ▾</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
