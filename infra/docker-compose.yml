name: ai-auto-image

# 生产部署：连接外部 PostgreSQL / Redis（如 1Panel 托管实例）。
# 在仓库根 .env 提供 DATABASE_URL / REDIS_URL / APP_SECRET，然后：
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: aai-app
    restart: unless-stopped
    # 默认仅绑定回环，由 1Panel OpenResty（反代 + HTTPS）对外暴露。
    # 临时公网直连测试时，在 .env 设置 APP_BIND_ADDRESS=0.0.0.0，并放行宿主机/云防火墙 1235。
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:1235:1235"
    volumes:
      - aai-data:/data
    # 根目录 .env 同时作为 Compose 插值来源和容器运行时环境来源。
    # 这样 TEXT_*/IMAGE_*、支付和自定义兼容网关参数才能被首次自动导入。
    env_file:
      - ../.env
    environment:
      # ── 数据库（必填）：postgres://user:pass@1Panel-postgresql-VkBl:5432/ai_image ──
      DATABASE_URL: ${DATABASE_URL:?请在 .env 配置 DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-}
      # ── 安全（必填）：渠道密钥加密主密钥；沿用导入数据时须与加密端一致（见 docs/deployment.md）──
      APP_SECRET: ${APP_SECRET:?请在 .env 配置 APP_SECRET}
      # ── 注册策略：默认关闭；开启需 REGISTER_ENABLED=1，可选邀请码 ──
      REGISTER_ENABLED: ${REGISTER_ENABLED:-0}
      REGISTER_INVITE_CODE: ${REGISTER_INVITE_CODE:-}
      PORT: "1235"
      DATA_DIR: /data
      ASSETS_DIR: /data/assets
      EXPORTS_DIR: /data/exports
      SQLITE_MIGRATIONS_DIR: /app/drizzle
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 生产镜像禁止模拟支付；即使 .env.example 未被改写也不会误开。
      PAYMENT_MOCK_ENABLED: "0"
    # 普通 Docker Compose 也生效的内存上限；deploy.resources 兼容其他编排方式。
    mem_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1235/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  aai-data:

networks:
  default:
    # 与 1Panel 托管的 PostgreSQL/Redis 容器同网络，才能用容器名直连。
    # 服务器上确认实际网络名：docker network ls | grep -i 1panel
    name: ${DOCKER_NETWORK:-1panel-network}
    external: true
