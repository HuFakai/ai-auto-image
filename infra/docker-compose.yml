name: ai-auto-image

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: aai-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - aai-data:/data
    environment:
      # 真实 Provider 密钥由宿主机 .env 注入；留空时使用 Mock
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      IMAGE_GENERATION_CONCURRENCY_DEFAULT: "1"
      IMAGE_GENERATION_CONCURRENCY_MAX: "4"
      IMAGE_POSTPROCESS_CONCURRENCY_MAX: "1"
      JOB_RUNNER_CONCURRENCY: "1"
      LOG_LEVEL: info
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  aai-data:
