name: ai-auto-image

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: aai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - app-data:/data
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      SQLITE_PATH: /data/app.db
      TEXT_PROVIDER_BASE_URL: ${TEXT_PROVIDER_BASE_URL}
      TEXT_PROVIDER_API_KEY: ${TEXT_PROVIDER_API_KEY}
      TEXT_PROVIDER_MODEL: ${TEXT_PROVIDER_MODEL}
      IMAGE_PROVIDER_BASE_URL: ${IMAGE_PROVIDER_BASE_URL}
      IMAGE_PROVIDER_API_KEY: ${IMAGE_PROVIDER_API_KEY}
      IMAGE_PROVIDER_MODEL: ${IMAGE_PROVIDER_MODEL}
      IMAGE_GENERATION_CONCURRENCY_DEFAULT: "1"
      IMAGE_GENERATION_CONCURRENCY_MAX: "4"
      IMAGE_POSTPROCESS_CONCURRENCY_MAX: "1"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
